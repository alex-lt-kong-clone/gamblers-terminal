name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      # --locked fails the run if pyproject.toml and uv.lock have drifted apart
      - run: uv sync --locked
      - run: cp modules/pe_monitor/config.sample.toml modules/pe_monitor/config.toml
      - run: uv run --no-sync pytest --quiet

  mypy:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run --no-sync mypy --strict --ignore-missing-imports core modules tests

  ruff:
    name: ruff check (risky calls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run --no-sync ruff check --output-format github
